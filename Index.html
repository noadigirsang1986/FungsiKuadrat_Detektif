<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kasus Parabola</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Atkinson+Hyperlegible:wght@400;700&family=Special+Elite&display=swap">
<style>
/* Layout: satu panggung kasus (stage) di bawah HUD; scene bab memakai dua kolom (bukti visual | meja analisis) yang menumpuk di HP. Tema noir tunggal, aksen kuning pita polisi. */
:root{
  --ink:#121419; --panel:#1b1e25; --panel2:#252933; --line:#3a404c;
  --chalk:#e7e9ed; --muted:#a0a7b3;
  --tape:#f2c230; --tape-ink:#1a1505;
  --red:#d9503f; --ok:#5fbf8f; --blue:#6aa7e8;
  --paper:#ece4cf; --paper-ink:#2b261c; --cork:#9c6f42; --mud:#8a5a2b;
  --f-display:"Alfa Slab One", "Rockwell", Georgia, serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-type:"Special Elite", "Courier New", monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--chalk)}
body{font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:12px 40px;
  background-image:radial-gradient(ellipse at 50% -10%, #2a2f3a 0%, transparent 60%);
  min-height:100%;
}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:clamp(1.35rem,3.5vw,1.9rem)}
h3{font-size:1.1rem}
p{margin:0}
.type{font-family:var(--f-type)}
.muted{color:var(--muted)}
.tape{height:14px;border-radius:2px;background:repeating-linear-gradient(-45deg,var(--tape) 0 16px,var(--ink) 16px 32px);opacity:.9}
.tapelabel{display:inline-block;background:var(--tape);color:var(--tape-ink);font-family:var(--f-type);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;padding:3px 10px;transform:rotate(-1.5deg)}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.hud .brand{font-family:var(--f-display);font-size:1rem;color:var(--tape);margin-right:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--f-type);font-size:.75rem;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.on{border-color:var(--tape);color:var(--tape)}
.chip.done{background:var(--ok);border-color:var(--ok);color:#0d1f16}
.score{font-family:var(--f-type);font-variant-numeric:tabular-nums}

button,.btn{font:inherit;font-weight:700;min-height:44px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--chalk);cursor:pointer;touch-action:manipulation}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
button.primary{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
button.primary:hover{filter:brightness(1.07)}
button.ghost{background:transparent}
button.sm{min-height:36px;padding:6px 10px;font-size:.85rem}
button[disabled]{opacity:.45;cursor:not-allowed}
.blink{animation:blink 1s steps(2) infinite;border-color:var(--tape)!important;color:var(--tape)}
@keyframes blink{50%{background:var(--tape);color:var(--tape-ink)}}

.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:start}
.grid2>*{min-width:0}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;position:relative}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
label{font-weight:700;font-size:.92rem}
input[type=text],input[type=number],input:not([type]),select,textarea{font:inherit;min-height:44px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--ink);color:var(--chalk);width:100%}
input.n{width:5.5em;text-align:center;font-family:var(--f-type)}
textarea{min-height:90px;resize:vertical}
input[type=range]{width:100%;height:44px;accent-color:var(--tape)}
.field{display:flex;flex-direction:column;gap:4px}
.eq{font-family:var(--f-type);font-size:1.02rem;background:var(--ink);border:1px dashed var(--line);border-radius:6px;padding:6px 10px;display:inline-block}
.fb{border-radius:8px;padding:10px 12px;font-size:.95rem;border:1px solid}
.fb.ok{border-color:var(--ok);color:var(--ok);background:rgba(95,191,143,.08)}
.fb.no{border-color:var(--red);color:#f0a093;background:rgba(217,80,63,.08)}
.fb.info{border-color:var(--tape);color:var(--tape);background:rgba(242,194,48,.07)}
.roletag{position:absolute;top:-10px;right:10px;font-family:var(--f-type);font-size:.7rem;background:var(--blue);color:#08131f;padding:2px 8px;border-radius:4px}
.step{display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--line);padding-left:12px}
.step.cur{border-left-color:var(--tape)}
.step.ok{border-left-color:var(--ok)}
.choice{display:flex;flex-direction:column;gap:8px}
.choice button{text-align:left;font-weight:400}

/* graph */
.graph{width:100%;height:auto;max-width:100%;display:block;background:#161920;border-radius:8px;touch-action:manipulation}
.graph .g{stroke:#2a2f39;stroke-width:1}
.graph .ax{stroke:#5b6372;stroke-width:1.5}
.graph text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.graph .lbl{fill:var(--chalk);font-size:11px;font-weight:700}
.trace{fill:none;stroke:var(--mud);stroke-width:10;stroke-linecap:round;stroke-dasharray:1 12;opacity:.95}
.trace2{fill:none;stroke:var(--mud);stroke-width:4;opacity:.35}
.cv{fill:none;stroke-width:3;stroke-linecap:round}
.mag{fill:rgba(242,194,48,.12);stroke:var(--tape);stroke-width:2;stroke-dasharray:5 4}

/* dialog */
.talk{display:flex;gap:12px;align-items:flex-start}
.talk .av{flex:0 0 76px;width:76px;height:76px;border-radius:50%;background:#2c313c;border:2px solid var(--line);overflow:hidden}
.talk .av svg{width:100%;height:100%;display:block}
.bubble{background:var(--paper);color:var(--paper-ink);border-radius:4px 12px 12px 12px;padding:10px 14px;font-family:var(--f-type);flex:1;min-width:0;font-size:1rem}
.bubble b{font-family:var(--f-body)}
.who{font-family:var(--f-body);font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:#7a6a45;display:block;margin-bottom:2px}

/* evidence card */
.evcard{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:10px 12px;font-family:var(--f-type);box-shadow:0 6px 14px rgba(0,0,0,.35);position:relative}
.evcard .t{font-family:var(--f-body);font-weight:700;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:#8a3d2f}
.stamp{position:absolute;right:10px;top:8px;border:2px solid var(--red);color:var(--red);font-family:var(--f-display);font-size:.8rem;padding:1px 6px;transform:rotate(8deg);opacity:.85}
.newcard{animation:drop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translateY(-30px) rotate(-6deg);opacity:0}}

/* title */
.hero{display:grid;gap:14px;text-align:left}
.hero h1{font-size:clamp(2.4rem,9vw,4.6rem);color:var(--tape);line-height:.95;text-shadow:3px 3px 0 #000}
.hero .sub{font-family:var(--f-type);font-size:clamp(1rem,2.6vw,1.25rem)}
.scene-svg{width:100%;max-width:100%;height:auto;display:block;border-radius:10px;background:#0f1115}
.ball-anim{offset-path:path("M20 230 Q 230 -40 420 96");animation:fly 2.4s cubic-bezier(.4,.1,.7,1) .4s both}
@keyframes fly{from{offset-distance:0%}to{offset-distance:100%}}
.crack{opacity:0;animation:show .1s linear 2.4s forwards}
@keyframes show{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.ball-anim{animation:none;offset-distance:100%}.crack{animation:none;opacity:1}.blink,.newcard{animation:none}}

/* ID card */
.idcard{background:var(--paper);color:var(--paper-ink);border-radius:10px;padding:14px;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;font-family:var(--f-type);max-width:420px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.idcard .ph{width:72px;height:72px;border-radius:6px;background:#cfc5ab;display:grid;place-items:center;overflow:hidden}
.idcard .nm{font-family:var(--f-display);font-size:1.15rem;line-height:1.1}

/* board */
.board{position:relative;background:var(--cork);background-image:radial-gradient(rgba(0,0,0,.18) 1px,transparent 1.5px),radial-gradient(rgba(255,255,255,.08) 1px,transparent 1.5px);background-size:9px 9px,13px 13px;border:8px solid #5a3b1f;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:12px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.col{background:rgba(0,0,0,.18);border:2px dashed rgba(255,255,255,.25);border-radius:8px;padding:8px 6px;min-height:150px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.col.hot{border-color:var(--tape);background:rgba(242,194,48,.15)}
.col .pin{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;color:#fff;font-size:.85rem;text-shadow:0 1px 2px #000}
.col .pin .ph{width:54px;height:54px;border-radius:4px;background:#e8e1cc;overflow:hidden;border:3px solid #fff;transform:rotate(-2deg)}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:50px}
.card{background:var(--paper);color:var(--paper-ink);font-family:var(--f-type);font-size:.8rem;line-height:1.3;padding:7px 8px;border-radius:3px;box-shadow:0 3px 8px rgba(0,0,0,.4);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;position:relative;max-width:100%}
.tray .card{flex:1 1 150px;max-width:220px}
.card b{display:block;font-family:var(--f-body);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:#8a3d2f}
.card.sel{outline:3px solid var(--tape)}
.card.dragging{position:fixed;z-index:50;pointer-events:none;width:190px;transform:rotate(3deg);box-shadow:0 12px 26px rgba(0,0,0,.55)}
.strings{position:absolute;inset:0;pointer-events:none;overflow:visible}
.strings line{stroke:#c0281b;stroke-width:2.2}

/* modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(5,6,9,.78);display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(12px, env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:760px;width:100%;padding:18px;display:flex;flex-direction:column;gap:14px}
.folder{background:#c9a46a;color:#2a1d0b;border-radius:4px 14px 6px 6px;padding:16px;position:relative}
.folder::before{content:"BERKAS FORENSIK";position:absolute;top:-14px;left:14px;background:#c9a46a;padding:2px 12px;border-radius:6px 6px 0 0;font-family:var(--f-type);font-size:.75rem;letter-spacing:.1em}
.folder .doc{background:var(--paper);border-radius:3px;padding:12px;font-size:.93rem;line-height:1.5;display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{min-height:38px;padding:6px 10px;font-size:.85rem;background:#e7dcc0;color:#2a1d0b;border-color:#b89a63}
.tabs button.on{background:var(--paper-ink);color:var(--paper)}
.meter{height:16px;background:var(--ink);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--tape) 60%,var(--ok));transition:width .2s}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
.cctv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cctv figure{margin:0;background:#0b0c0e;border:2px solid #333;border-radius:4px;filter:grayscale(1) contrast(1.1);position:relative}
.cctv figcaption{font-family:var(--f-type);font-size:.72rem;color:#ddd;padding:3px 6px;display:flex;justify-content:space-between}
.cctv figure::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);pointer-events:none}
.rec{color:#ff5a4a}

.cert{background:var(--paper);color:var(--paper-ink);border:10px double #8a6a2a;border-radius:6px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.cert h2{color:#6b4a12;font-size:clamp(1.4rem,5vw,2.2rem)}
.cert .nm{font-family:var(--f-display);font-size:clamp(1.5rem,6vw,2.4rem);color:var(--paper-ink);border-bottom:2px solid #8a6a2a;padding:0 12px}
.badge{width:96px;height:96px}
.small{font-size:.82rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:560px){
  .stage{padding:14px}
  .cols{grid-template-columns:repeat(3,minmax(0,1fr))}
  .card{font-size:.72rem}
  .col .pin .ph{width:44px;height:44px}
}
</style>

  <main class="stage" id="stage" aria-live="polite"></main>

<script>
/* =====================================================================
   DATA KASUS — guru dapat mengganti angka/cerita di sini.
   Fungsi ditulis h(x) = a x² + b x + c (x = jarak mendatar, h = tinggi, meter)
   ===================================================================== */
const DATA = {
  tinggiKaca: 6.5,
  jejak:  { a:-0.5, b:4, c:1 },            // jejak lumpur di dinding (Bab 1)
  raka:   { nama:"Raka",  olahraga:"basket", a:-1,   b:4, c:2, klaim:5,   saksi:"Pak Udin, penjaga kantin" },
  dinda:  { nama:"Dinda", olahraga:"voli",   a:-0.5, b:3, c:1, klaim:5.5, saksi:"Sari, teman sekelas Dinda" },
  robo:   { nama:"Si Robo", lubang:1 },
  cctv:   [[0,1],[2,7],[4,9]],             // tiga frame CCTV (x, tinggi)
  ambangMirip: 90
};

/* ---------- util ---------- */
const $ = s => document.querySelector(s);
const num = v => { v = String(v ?? '').trim().replace(/−/g,'-').replace(',','.'); return v === '' ? NaN : Number(v); };
const near = (a,b,t=0.011) => Math.abs(a-b) <= t;
function fmt(n){ const r = Math.round(n*100)/100; return String(Object.is(r,-0)?0:r).replace('.',',').replace('-','−'); }
function poly(a,b,c){
  let s='';
  const term=(k,v,first)=>{ if(near(k,0,1e-9)) return ''; const sg=k<0?'−':'+'; const ab=Math.abs(k); const co=(ab===1&&v)?'':fmt(ab);
    return first ? (k<0?'−':'')+co+v : ' '+sg+' '+co+v; };
  s+=term(a,'x²',true); s+=term(b,'x',s===''); s+=term(c,'',s==='');
  return s||'0';
}
const f = p => x => p.a*x*x + p.b*x + p.c;
const vtx = p => { const x=-p.b/(2*p.a); return [x, f(p)(x)]; };
const Dval = (p,H) => p.b*p.b - 4*p.a*(p.c-H);
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Si Robo dihitung dari 3 titik CCTV (agar konsisten bila guru mengganti data) */
(function solveRobo(){
  const [[x0,y0],[x1,y1],[x2,y2]] = DATA.cctv;
  // asumsi x0 = 0  → c = y0
  const c=y0, r1=y1-c, r2=y2-c;
  const det = x1*x1*x2 - x2*x2*x1;
  const a = (r1*x2 - r2*x1)/det, b = (x1*x1*r2 - x2*x2*r1)/det;
  Object.assign(DATA.robo,{a,b,c});
})();
const SUS = { raka:DATA.raka, dinda:DATA.dinda, robo:DATA.robo };

/* ---------- audio ---------- */
let actx=null, musicTimer=null;
function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx&&actx.state==='suspended') actx.resume(); return actx; }
function noise(c,dur,shape){ const n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*shape(i/n); const s=c.createBufferSource(); s.buffer=b; return s; }
function sfxGlass(){ const c=ac(); if(!c) return; const t=c.currentTime;
  const s=noise(c,.7,u=>Math.pow(1-u,3)); const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1800; const g=c.createGain(); g.gain.value=.45; s.connect(hp).connect(g).connect(c.destination); s.start(t);
  for(let i=0;i<7;i++){ const o=c.createOscillator(), gg=c.createGain(); o.type='sine'; o.frequency.value=2400+Math.random()*4200; const st=t+Math.random()*.25; gg.gain.setValueAtTime(.08,st); gg.gain.exponentialRampToValueAtTime(.0001,st+.35); o.connect(gg).connect(c.destination); o.start(st); o.stop(st+.4); } }
function sfxTick(){ const c=actx; if(!c||c.state!=='running') return; const s=noise(c,.025,u=>1-u); const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2200; const g=c.createGain(); g.gain.value=.12; s.connect(bp).connect(g).connect(c.destination); s.start(); }
function sfxNote(ok){ const c=ac(); if(!c) return; const t=c.currentTime; (ok?[523,659,784]:[220,185]).forEach((fq,i)=>{ const o=c.createOscillator(), g=c.createGain(); o.type=ok?'triangle':'sawtooth'; o.frequency.value=fq; g.gain.setValueAtTime(ok?.08:.05,t+i*.09); g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.25); o.connect(g).connect(c.destination); o.start(t+i*.09); o.stop(t+i*.09+.3); }); }
function setMusic(on){
  S.music=on; save(); clearInterval(musicTimer); musicTimer=null;
  if(!on) { updateHud(); return; }
  const c=ac(); if(!c) return;
  const notes=[55,65.41,73.42,77.78,73.42,65.41,82.41,77.78]; let i=0;
  musicTimer=setInterval(()=>{ const t=c.currentTime, o=c.createOscillator(), g=c.createGain(); o.type='triangle'; o.frequency.value=notes[i++%notes.length];
    g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.07,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+.38); o.connect(g).connect(c.destination); o.start(t); o.stop(t+.4);
    if(i%2===0){ const h=noise(c,.04,u=>1-u), hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7000; const hg=c.createGain(); hg.gain.value=.025; h.connect(hp).connect(hg).connect(c.destination); h.start(t); }
  },420);
  updateHud();
}
function say(text){ try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g,'')); u.lang='id-ID'; u.rate=1; const v=speechSynthesis.getVoices().find(v=>/^id/i.test(v.lang)); if(v) u.voice=v; speechSynthesis.speak(u);}catch(e){} }

/* ---------- avatar ---------- */
function av(kind,mood=''){
  const face=(skin,mouth)=>`<circle cx="50" cy="46" r="20" fill="${skin}"/>
    ${mood==='gugup'?'<path d="M38 37 l8 3 M62 37 l-8 3" stroke="#222" stroke-width="2.4"/><path d="M70 36 q4 7 0 10 q-4 -3 0 -10z" fill="#7cc6ff"/>':''}
    <circle cx="43" cy="46" r="2.4" fill="#1a1a1a"/><circle cx="57" cy="46" r="2.4" fill="#1a1a1a"/>

/* ---------- grafik ---------- */
let gid=0;
function graph(o){
  const W=o.w||360, H=o.h||260, P=28, R=10;
  const [x0,x1]=o.xr, [y0,y1]=o.yr;
  const X=x=>P+(x-x0)/(x1-x0)*(W-P-R), Y=y=>H-P-(y-y0)/(y1-y0)*(H-P-R);
  const id='g'+(++gid);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="graph" ${o.id?`id="${o.id}"`:''} role="img" aria-label="${esc(o.label||'Grafik bidang koordinat')}"><defs><clipPath id="${id}"><rect x="${P}" y="${R}" width="${W-P-R}" height="${H-P-R}"/></clipPath></defs>`;
  if(o.bg) s+=o.bg(X,Y,W,H);
  if(o.grid!==false){
    for(let x=Math.ceil(x0);x<=x1;x++) s+=`<line class="g" x1="${X(x)}" y1="${Y(y0)}" x2="${X(x)}" y2="${Y(y1)}"/><text x="${X(x)}" y="${H-P+13}" text-anchor="middle">${x}</text>`;
    for(let y=Math.ceil(y0);y<=y1;y++) s+=`<line class="g" x1="${X(x0)}" y1="${Y(y)}" x2="${X(x1)}" y2="${Y(y)}"/><text x="${P-6}" y="${Y(y)+3}" text-anchor="end">${y}</text>`;
  }
  s+=`<line class="ax" x1="${X(x0)}" y1="${Y(Math.max(y0,0))}" x2="${X(x1)}" y2="${Y(Math.max(y0,0))}"/><line class="ax" x1="${X(Math.max(x0,0))}" y1="${Y(y0)}" x2="${X(Math.max(x0,0))}" y2="${Y(y1)}"/>`;
  s+=`<text x="${W-R}" y="${H-P-4}" text-anchor="end">x (m)</text><text x="${P+4}" y="${R+10}">h (m)</text>`;
  s+=`<g clip-path="url(#${id})">`;
  (o.hlines||[]).forEach(h=>{ s+=`<line x1="${X(x0)}" y1="${Y(h.y)}" x2="${X(x1)}" y2="${Y(h.y)}" stroke="${h.color||'var(--blue)'}" stroke-width="${h.w||2.5}" ${h.dash?`stroke-dasharray="${h.dash}"`:''}/>${h.label?`<text class="lbl" x="${X(x1)-4}" y="${Y(h.y)-5}" text-anchor="end" style="fill:${h.color||'var(--blue)'}">${h.label}</text>`:''}`; });
  (o.vlines||[]).forEach(v=>{ s+=`<line x1="${X(v.x)}" y1="${Y(y0)}" x2="${X(v.x)}" y2="${Y(y1)}" stroke="${v.color||'var(--tape)'}" stroke-width="2" stroke-dasharray="6 5"/>${v.label?`<text class="lbl" x="${X(v.x)+5}" y="${R+24}" style="fill:${v.color||'var(--tape)'}">${v.label}</text>`:''}`; });
  (o.curves||[]).forEach(c=>{
    const a=c.from??x0, b=c.to??x1, n=140; let d='';
    for(let i=0;i<=n;i++){ const x=a+(b-a)*i/n, y=c.f(x); d+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(Math.max(y0-5,Math.min(y1+5,y))).toFixed(1); }
    if(c.trace){ s+=`<path class="trace2" d="${d}"/><path class="trace" d="${d}"/>`; }
    else s+=`<path class="cv" d="${d}" stroke="${c.color||'var(--tape)'}" ${c.dash?`stroke-dasharray="${c.dash}"`:''} ${c.op?`opacity="${c.op}"`:''}/>`;
    if(c.label){ const lx=c.lx??(a+b)/2; s+=`<text class="lbl" x="${X(lx)}" y="${Y(c.f(lx))-8}" text-anchor="middle" style="fill:${c.color||'var(--tape)'}">${c.label}</text>`; }
  });
  (o.mags||[]).forEach(m=>{ s+=`<circle class="mag" cx="${X(m.x)}" cy="${Y(m.y)}" r="${m.r||34}"/>`; });
  s+=`</g>`;
  (o.points||[]).forEach(p=>{ s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${p.r||6}" fill="${p.color||'var(--red)'}" stroke="#fff" stroke-width="2"/>${p.label?`<text class="lbl" x="${X(p.x)+9}" y="${Y(p.y)-8}">${p.label}</text>`:''}`; });
  s+=`</svg>`;
  graph.last={W,H,P,R,x0,x1,y0,y1};
  return s;
}
function svgToData(svg,e,m){
  const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  return [ m.x0+(p.x-m.P)/(m.W-m.P-m.R)*(m.x1-m.x0), m.y0+(m.H-m.P-p.y)/(m.H-m.P-m.R)*(m.y1-m.y0) ];
}

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const v=JSON.parse(localStorage.getItem(KEY)); return v&&v.ch?v:null; }catch(e){ return null; } }

/* ---------- HUD ---------- */

/* ---------- dialog ketik ---------- */
function talk(kind,who,text,mood){ return `<div class="talk"><div class="av">${av(kind,mood)}</div><div class="bubble"><span class="who">${who}</span><span class="tt" data-t="${esc(text)}"></span></div></div>`; }
function runTalks(root=document){
  root.querySelectorAll('.tt').forEach(el=>{
    const full=el.dataset.t; if(reduceMotion){ el.textContent=full; return; }
    let i=0; el.innerHTML=''; const plain=full;
    const iv=setInterval(()=>{ i+=2; el.textContent=plain.slice(0,i); if(i%6===0) sfxTick(); if(i>=plain.length){ clearInterval(iv); el.textContent=full; } },22);
    el.closest('.bubble').onclick=()=>{ clearInterval(iv); el.textContent=full; };
  });
}

function modal(html){ const m=$('#modal'); m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; m.hidden=false; m.onclick=e=>{ if(e.target===m) closeModal(); }; return m; }

/* ---------- Berkas Forensik (S05) ---------- */
const BERKAS={
  umum:`<b>Bentuk umum</b><span>f(x) = ax² + bx + c, dengan a ≠ 0.</span><span><b>a</b> menentukan arah buka: a &gt; 0 terbuka ke atas (punya titik terendah), a &lt; 0 terbuka ke bawah (punya titik tertinggi). Makin besar |a|, makin sempit parabolanya.</span><span><b>c</b> adalah tinggi saat x = 0, yaitu titik potong dengan sumbu-y.</span>`,
  puncak:`<b>Titik puncak dan sumbu simetri</b><span>Sumbu simetri: x = −b / (2a).</span><span>Tinggi puncak: substitusikan x puncak ke f(x), atau pakai y = −D / (4a).</span><span>Contoh: f(x) = −x² + 4x + 2 → x = −4 / (2·(−1)) = 2, f(2) = −4 + 8 + 2 = 6. Puncak (2, 6).</span>`,
  akar:`<b>Akar dan diskriminan</b><span>Untuk ax² + bx + c = 0, diskriminan D = b² − 4ac.</span><span>D &gt; 0: dua akar real (garis memotong parabola di dua titik). D = 0: satu akar (menyinggung). D &lt; 0: tidak ada akar real (tidak pernah mencapai).</span><span>Bisakah bola mencapai tinggi H? Bentuk ax² + bx + c = H → ax² + bx + (c − H) = 0, lalu hitung D.</span>`,
  tiga:`<b>Menyusun fungsi dari 3 titik</b><span>Substitusikan tiap titik ke f(x) = ax² + bx + c sehingga didapat 3 persamaan.</span><span>Titik dengan x = 0 langsung memberi c. Dua persamaan sisanya diselesaikan dengan eliminasi: samakan koefisien b, lalu kurangkan untuk mendapat a, kemudian substitusi balik untuk b.</span>`
};
function openBerkas(){
  const n=CHMAP[S.scene];
  if(n && !S.ch[n].done && S.ch[n].wrong>S.ch[n].helpAt){ S.ch[n].help++; S.ch[n].helpAt=S.ch[n].wrong; save(); updateHud(); }
  let tab=n===4?'akar':n===3?'tiga':n===2?'puncak':'umum'; const ex={a:-1,b:4,c:2};
  const m=modal(`<div class="row" style="justify-content:space-between"><h2>Berkas Forensik</h2><button class="sm" id="bx">Tutup</button></div>
   ${n&&S.ch[n].help?`<p class="fb info small">Bantuan setelah salah tercatat: ${S.ch[n].help} kali (−2 poin per bantuan pada bab ini, skor bab minimal 5).</p>`:''}
   <div class="folder"><div class="doc"><div class="tabs" id="btabs">${[['umum','Bentuk umum'],['puncak','Puncak & sumbu'],['akar','Akar & D'],['tiga','Fungsi dari 3 titik']].map(([k,l])=>`<button data-k="${k}">${l}</button>`).join('')}</div><div id="bdoc" style="display:flex;flex-direction:column;gap:8px"></div></div></div>
   <div class="box"><h3>Laboratorium grafik</h3><div id="bg"></div>
     <div class="grid2" style="gap:6px">${['a','b','c'].map(k=>`<div class="field"><label for="bs${k}">${k} = <span id="bv${k}"></span></label><input type="range" id="bs${k}" min="${k==='a'?-2:k==='b'?-6:-4}" max="${k==='a'?2:k==='b'?6:8}" step="${k==='a'?0.1:0.5}" value="${ex[k]}"></div>`).join('')}</div>
     <p class="type" id="binfo"></p></div>`);
  const draw=()=>{ const p={a:+$('#bsa').value||0.0001,b:+$('#bsb').value,c:+$('#bsc').value}; ['a','b','c'].forEach(k=>$('#bv'+k).textContent=fmt(+$('#bs'+k).value));
    const [vx,vy]=vtx(p), D=p.b*p.b-4*p.a*p.c;
    $('#bg').innerHTML=graph({xr:[-2,8],yr:[-4,10],curves:[{f:f(p),color:'var(--tape)'}],points:[{x:vx,y:vy,label:`(${fmt(vx)}, ${fmt(vy)})`}],vlines:[{x:vx}]});
    $('#binfo').innerHTML=`f(x) = ${poly(p.a,p.b,p.c)}<br>Sumbu simetri x = ${fmt(vx)} · Puncak (${fmt(vx)}, ${fmt(vy)}) · D = ${fmt(D)} ${D>0?'→ 2 akar':D===0?'→ 1 akar':'→ tidak ada akar real'}`; };
  const setTab=k=>{ tab=k; $('#bdoc').innerHTML=BERKAS[k]; m.querySelectorAll('#btabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===k)); };
  m.querySelectorAll('#btabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.k));
  ['a','b','c'].forEach(k=>$('#bs'+k).oninput=draw); $('#bx').onclick=closeModal; setTab(tab); draw();
}

   <div class="actions"><span id="rmsg" class="muted small" style="margin-right:auto"></span>${L.length?'<button id="rclr" class="ghost">Hapus rekap</button><button class="primary" id="rcp">Salin semua (TSV)</button>':''}</div>`);
  $('#rx').onclick=closeModal;
  if(L.length){
    $('#rcp').onclick=()=>{ const h='Tanggal\tNama\tKelas\tAbsen\tMode\tBab1\tBab2\tBab3\tBab4\tCocok\tTuduhan\tLaporan\tTotal\tBantuan\tEnding\tLaporan Kasus';
      const t=[h,...L.map(r=>[r.tgl,r.nama,r.kelas,r.absen,r.mode,r.b1,r.b2,r.b3,r.b4,r.cocok,r.tuduhan,r.laporan,r.total,r.bantuan,r.ending,r.teks.replace(/\s+/g,' ')].join('\t'))].join('\n');
      copyText(t,$('#rmsg')); };
    $('#rclr').onclick=()=>{ $('#rmsg').innerHTML='Yakin hapus semua rekap? <button class="sm" id="ry">Ya, hapus</button>'; $('#ry').onclick=()=>{ try{localStorage.removeItem(RKEY)}catch(e){} closeModal(); showRekap(); }; };
  }
}
function copyText(t,msgEl){
  const done=()=>{ if(msgEl) msgEl.textContent='Tersalin.'; };
  try{ navigator.clipboard.writeText(t).then(done).catch(fallback); }catch(e){ fallback(); }
  function fallback(){ const ta=document.createElement('textarea'); ta.value=t; ta.style.cssText='width:100%;min-height:120px'; msgEl.innerHTML='Salin manual dari kotak ini:'; msgEl.appendChild(ta); ta.select(); }
}

/* S04 Bab 1: Jejak di Dinding */
SCN.s04=st=>{
  const p=DATA.jejak, [vx,vy]=vtx(p), r1=(-p.b+Math.sqrt(p.b*p.b-4*p.a*p.c))/(2*p.a), r2=(-p.b-Math.sqrt(p.b*p.b-4*p.a*p.c))/(2*p.a);
  const from=Math.max(0,Math.min(r1,r2)), to=Math.max(r1,r2);
  const L={step:S.ch[1].done?4:1, tap:null, axis:0, mag:false, msg:'', cls:''};
  const xr=[0,Math.ceil(to)+1], yr=[0,Math.ceil(vy)+1];
  st.innerHTML=`<span class="tapelabel">Bab 1 · TKP</span><h2>Jejak di Dinding</h2>
   ${talk('vera','Inspektur Vera','Bola meninggalkan jejak lumpur melengkung di dinding samping gedung. Baca jejak itu: di mana puncaknya, di mana sumbu simetrinya, dan ke mana parabolanya membuka?')}
   <div class="grid2"><div class="box">${roleTag('Penyidik Lapangan')}<div id="gw"></div><label class="row small" style="font-weight:400"><input type="checkbox" id="grd" checked style="width:22px;height:22px"> Tampilkan grid koordinat</label></div>
   <div class="box">${roleTag('Analis')}<div id="steps" style="display:flex;flex-direction:column;gap:12px"></div><div id="fb"></div></div></div>
   <div class="actions"><button class="primary" id="nx" ${S.ch[1].done?'':'hidden'}>Lanjut ke Bab 2</button></div>`;
  const draw=()=>{ const g=$('#grd').checked;
    $('#gw').innerHTML=graph({id:'g1',xr,yr,grid:g,label:'Jejak lumpur bola di dinding',
      bg:(X,Y,W,H)=>`<rect x="0" y="0" width="${W}" height="${H}" fill="#2a2620"/>${Array.from({length:12},(_,i)=>`<line x1="0" y1="${i*24}" x2="${W}" y2="${i*24}" stroke="#332e26" stroke-width="2"/>`).join('')}`,
      curves:[{f:f(p),trace:true,from,to}],
      vlines:L.step>2||L.step===2?[{x:L.step>2?vx:L.axis,label:`x = ${fmt(L.step>2?vx:L.axis)}`}]:[],
      mags:L.mag?[{x:vx,y:vy-0.3,r:40}]:[],
      points:L.tap?[{x:L.tap[0],y:L.tap[1],color:L.step>1?'var(--ok)':'var(--red)',label:L.step>1?`(${fmt(vx)}, ${fmt(vy)})`:''}]:[] });
    const m=graph.last; const svg=$('#g1');
    svg.onclick=e=>{ if(L.step!==1) return; const [x,y]=svgToData(svg,e,m); const sx=Math.round(x*2)/2, sy=Math.round(y*2)/2;
      if(Math.abs(x-vx)<=0.6 && Math.abs(y-vy)<=0.7){ L.tap=[vx,vy]; L.step=2; L.axis=0; L.mag=false; fb(`Tepat. Puncak jejak di (${fmt(vx)}, ${fmt(vy)}). Titik tertinggi bola adalah ${fmt(vy)} m.`,'ok'); sfxNote(true); }
      else { L.tap=[sx,sy]; L.mag=true; wrong(1); fb(`Titik (${fmt(sx)}, ${fmt(sy)}) belum yang tertinggi. Kaca pembesar menyorot bagian jejak yang lebih tinggi. Coba lagi.`,'no'); }
      draw(); steps(); };
  };
  const fb=(t,c)=>{ $('#fb').innerHTML=`<p class="fb ${c}">${t}</p>`; };
  const steps=()=>{
    const s=(n,html)=>`<div class="step ${L.step===n?'cur':L.step>n?'ok':''}">${html}</div>`;
    $('#steps').innerHTML=
      s(1,`<b>1. Ketuk titik tertinggi jejak (titik puncak).</b>${L.step>1?`<span class="type">Puncak = (${fmt(vx)}, ${fmt(vy)})</span>`:'<span class="muted small">Ketuk langsung pada grafik.</span>'}`)+
      s(2,`<b>2. Tarik garis sumbu simetri.</b>${L.step===2?`<input type="range" id="ax" min="${xr[0]}" max="${xr[1]}" step="0.5" value="${L.axis}" aria-label="Posisi sumbu simetri"><div class="row"><span class="eq">x = <span id="axv">${fmt(L.axis)}</span></span><button id="axok">Pasang sumbu</button></div>`:L.step>2?`<span class="type">Sumbu simetri x = ${fmt(vx)}</span>`:''}`)+
      s(3,`<b>3. Tentukan tanda a dari arah buka parabola.</b>${L.step===3?`<div class="choice"><button id="ap">a &gt; 0 · terbuka ke atas</button><button id="an">a &lt; 0 · terbuka ke bawah</button></div>`:L.step>3?`<span class="type">a &lt; 0, parabola terbuka ke bawah</span>`:''}`);
    if(L.step===2){ $('#ax').oninput=e=>{ L.axis=+e.target.value; $('#axv').textContent=fmt(L.axis); draw(); };
      $('#axok').onclick=()=>{ if(near(L.axis,vx)){ L.step=3; sfxNote(true); fb('Sumbu simetri melewati puncak dan membelah jejak menjadi dua bagian yang sama.','ok'); }
        else { wrong(1); fb(`Garis x = ${fmt(L.axis)} tidak membelah jejak sama besar. Sumbu simetri selalu melewati titik puncak.`,'no'); } draw(); steps(); }; }
    if(L.step===3){ const ans=p.a<0; $('#ap').onclick=()=>pick(!ans); $('#an').onclick=()=>pick(ans); }
  };
  const pick=ok=>{ if(!ok){ wrong(1); fb('Perhatikan bentuknya: jejak naik lalu turun, jadi ada titik tertinggi. Parabola seperti itu terbuka ke bawah.','no'); return; }
    L.step=4; S.ch[1].done=true; addCard('c1'); save(); updateHud(); sfxNote(true); steps(); draw();
    $('#fb').innerHTML=cardHtml('Kartu Bukti · Jejak Dinding',`Puncak (${fmt(vx)}, ${fmt(vy)}), sumbu x = ${fmt(vx)}, a &lt; 0. Tinggi maksimum bola ${fmt(vy)} m.`,true)+`<p class="fb info small">Skor Bab 1: ${chScore(1)}/10</p>`;
    $('#nx').hidden=false; };
  $('#grd').onchange=draw;
  if(L.step===4){ L.tap=[vx,vy]; }
  draw(); steps();
  if(L.step===4) $('#fb').innerHTML=cardHtml('Kartu Bukti · Jejak Dinding',`Puncak (${fmt(vx)}, ${fmt(vy)}), sumbu x = ${fmt(vx)}, a &lt; 0.`);
  $('#nx').onclick=()=>go('s06');
};

SCN.s06=st=>{
  const W=[{k:'raka',av:'saksiA'},{k:'dinda',av:'saksiB'}];
  st.innerHTML=`<span class="tapelabel">Bab 2 · Ruang Interogasi</span><h2>Interogasi Saksi</h2>
   ${talk('vera','Inspektur Vera','Dua saksi memberi angka. Jangan langsung percaya. Hitung titik puncak tiap lintasan, lalu putuskan: percaya atau bantah. Wajib sertakan angka bukti.')}
   <div class="grid2" id="wits"></div><div id="fb2"></div>
   <div class="actions"><button class="primary" id="nx" ${S.ch[2].done?'':'hidden'}>Lanjut: Pilih Tersangka</button></div>`;
  const render=()=>{
    $('#wits').innerHTML=W.map(w=>{ const p=SUS[w.k], [vx,vy]=vtx(p), solved=S.b2[w.k], liar=!near(p.klaim,vy);
      return `<div class="box" id="w-${w.k}">${roleTag('Analis')}
        ${talk(w.av,p.saksi,`"Lemparan ${p.nama} itu tingginya paling cuma ${fmt(p.klaim)} meter!"`,solved?(liar?'gugup':'senang'):'')}
        <p>Lintasan ${p.olahraga} ${p.nama}: <span class="eq">h(x) = ${poly(p.a,p.b,p.c)}</span></p>
        ${solved?`<p class="fb ${liar?'no':'ok'}">${liar?`Klaim dibantah. Puncak sebenarnya (${fmt(vx)}, ${fmt(vy)}), jadi tinggi maksimum ${fmt(vy)} m, bukan ${fmt(p.klaim)} m. Saksi gugup.`:`Saksi jujur. Puncak (${fmt(vx)}, ${fmt(vy)}), tinggi maksimum memang ${fmt(vy)} m.`}</p>
          ${graph({xr:[0,7],yr:[0,7],h:200,curves:[{f:f(p),color:w.k==='raka'?'#e07a2e':'var(--blue)',from:0}],points:[{x:vx,y:vy,label:fmt(vy)+' m'}],hlines:[{y:p.klaim,color:'var(--muted)',dash:'4 4',label:'klaim '+fmt(p.klaim)}]})}`:
        `<div class="row"><span>Puncak: (</span><input class="n" id="px-${w.k}" inputmode="decimal" aria-label="x puncak ${p.nama}"><span>,</span><input class="n" id="py-${w.k}" inputmode="decimal" aria-label="tinggi puncak ${p.nama}"><span>)</span></div>
         <div class="row"><button id="pc-${w.k}">Percaya</button><button id="bt-${w.k}">Bantah</button></div><div id="wf-${w.k}"></div>`}
      </div>`; }).join('');
    W.forEach(w=>{ if(S.b2[w.k]) return; const p=SUS[w.k], [vx,vy]=vtx(p), liar=!near(p.klaim,vy);
      const check=verdict=>{ const x=num($('#px-'+w.k).value), y=num($('#py-'+w.k).value), out=$('#wf-'+w.k);
        if(isNaN(x)||isNaN(y)){ out.innerHTML='<p class="fb info">Isi dulu angka bukti: koordinat titik puncak.</p>'; return; }
        if(!near(x,vx)){ wrong(2); out.innerHTML=`<p class="fb no">x puncak belum tepat. Gunakan x = −b / (2a) dengan a = ${fmt(p.a)} dan b = ${fmt(p.b)}.</p>`; return; }
        if(!near(y,vy)){ wrong(2); out.innerHTML=`<p class="fb no">x puncak sudah benar (${fmt(vx)}). Sekarang substitusikan x = ${fmt(vx)} ke h(x) untuk mendapat tingginya.</p>`; return; }
        if(verdict!==(liar?'bantah':'percaya')){ wrong(2); out.innerHTML=`<p class="fb no">Angkamu benar: puncak ${fmt(vy)} m. Bandingkan dengan klaim saksi ${fmt(p.klaim)} m. Apakah sama?</p>`; return; }
        S.b2[w.k]=true; sfxNote(true); save(); render(); finish(); };
      $('#pc-'+w.k).onclick=()=>check('percaya'); $('#bt-'+w.k).onclick=()=>check('bantah'); });
    runTalks($('#wits'));
  };
  const finish=()=>{ if(!(S.b2.raka&&S.b2.dinda)||S.ch[2].done) return; S.ch[2].done=true; addCard('c2'); addCard('c3'); save(); updateHud();
    const [,ry]=vtx(DATA.raka), [,dy]=vtx(DATA.dinda);
    $('#fb2').innerHTML=`<div class="grid2">${cardHtml('Kartu Bukti · Kesaksian Dibantah',`Puncak lemparan Raka ${fmt(ry)} m, bukan ${fmt(DATA.raka.klaim)} m.`,true)}${cardHtml('Kartu Bukti · Kesaksian Jujur',`Puncak servis Dinda ${fmt(dy)} m.`,true)}</div><p class="fb info small">Skor Bab 2: ${chScore(2)}/10. Saksi yang berbohong belum tentu membuat Raka bersalah. Catat saja datanya.</p>`;
    $('#nx').hidden=false; };
  render();
  if(S.ch[2].done){ S.ch[2].done=false; finish(); }
  $('#nx').onclick=()=>go('s07');
};

/* S08a / S08b Cocokkan Jejak */
function matchScene(st,k){
  const p=SUS[k], col=k==='raka'?'#e07a2e':'var(--blue)';
  const disc=Math.sqrt(p.b*p.b-4*p.a*p.c), rr=Math.max((-p.b+disc)/(2*p.a),(-p.b-disc)/(2*p.a));
  const to=Math.min(rr,8), xr=[0,Math.ceil(to)+1];
  const U={a:-1.5,b:2,c:3, sim:0};
  const bg=k==='raka'
    ? (X,Y,W,H)=>`<rect width="${W}" height="${H}" fill="#3b2a1c"/><rect x="0" y="${Y(0)}" width="${W}" height="${H-Y(0)}" fill="#4a3322"/>${[1,2,3].map(i=>`<rect x="${X(0)+i*30}" y="${Y(0)-i*14}" width="${W}" height="10" fill="#2e2117"/>`).join('')}<rect x="${X(to)-3}" y="${Y(4)}" width="6" height="${Y(0)-Y(4)}" fill="#999"/><ellipse cx="${X(to)-18}" cy="${Y(3.05)}" rx="16" ry="4" fill="none" stroke="#e07a2e" stroke-width="3"/>`
    : (X,Y,W,H)=>`<rect width="${W}" height="${H}" fill="#1d2c3a"/><rect x="0" y="${Y(0)}" width="${W}" height="${H-Y(0)}" fill="#2a3e52"/><line x1="${X(xr[1]*0.82)}" y1="${Y(0)}" x2="${X(xr[1]*0.82)}" y2="${Y(2.4)}" stroke="#ddd" stroke-width="3"/>${Array.from({length:6},(_,i)=>`<line x1="${X(xr[1]*0.82)-4}" y1="${Y(1.2+i*0.2)}" x2="${X(xr[1]*0.82)+4}" y2="${Y(1.2+i*0.2)}" stroke="#bbb"/>`).join('')}<rect x="${X(0)-2}" y="${Y(0)-4}" width="16" height="4" fill="var(--tape)"/>`;
  st.innerHTML=`<span class="tapelabel">Jalur ${p.nama} · Lapangan ${p.olahraga}</span><h2>Cocokkan Jejak</h2>
   ${talk('vera','Inspektur Vera',`Ini foto lintasan ${p.olahraga === 'basket' ? 'lemparan' : 'servis'} ${p.nama} yang terekam samar. Geser a, b, dan c sampai grafikmu menempel pada jejak. Kemiripan minimal ${DATA.ambangMirip}%.`)}
   <div class="grid2"><div class="box">${roleTag('Penyidik Lapangan')}<div id="gw"></div>
     <div class="field"><span class="small"><b>Kemiripan: <span id="pct">0</span>%</b></span><div class="meter"><i id="bar" style="width:0%"></i></div></div></div>
   <div class="box">${roleTag('Analis')}
     <p class="eq" id="feq"></p>
     ${[['a',-2,0,0.1],['b',0,6,0.5],['c',0,4,0.5]].map(([n,mi,ma,stp])=>`<div class="field"><label for="s${n}">${n} = <span id="v${n}"></span></label><input type="range" id="s${n}" min="${mi}" max="${ma}" step="${stp}" value="${U[n]}"></div>`).join('')}
     <div class="actions"><button class="primary" id="chk" ${S.match.done?'disabled':''}>Cocokkan</button></div><div id="fb"></div></div></div>
   <div class="actions"><button class="primary" id="nx" ${S.match.done?'':'hidden'}>Lanjut ke Bab 3</button></div>`;
  const simil=()=>{ let e=0,n=60; for(let i=0;i<=n;i++){ const x=to*i/n; e+=Math.abs(f(U)(x)-f(p)(x)); } e/=n+1; return Math.max(0,Math.round(100*(1-e/2.5))); };
  const draw=()=>{ ['a','b','c'].forEach(n=>{ U[n]=+$('#s'+n).value; $('#v'+n).textContent=fmt(U[n]); }); if(near(U.a,0,1e-6)) U.a=-0.1;
    U.sim=simil(); $('#pct').textContent=U.sim; $('#bar').style.width=U.sim+'%'; $('#feq').textContent='h(x) = '+poly(U.a,U.b,U.c);
    $('#gw').innerHTML=graph({xr,yr:[0,8],label:'Foto lintasan barang bukti dan grafikmu',bg,curves:[{f:f(p),trace:true,from:0,to},{f:f(U),color:'var(--tape)',from:0,to:xr[1]}]}); };
  ['a','b','c'].forEach(n=>$('#s'+n).oninput=draw); draw();
  if(S.match.done){ $('#fb').innerHTML=cardHtml(`Kartu Bukti · Jejak ${p.nama}`,`Lintasan cocok: h(x) = ${poly(p.a,p.b,p.c)}`); }
  $('#chk').onclick=()=>{ S.match.tries++; save();

/* S12 Sidang Kasus */
function nilaiLaporan(){
  const R=S.report, t=R.alasan.toLowerCase(), H=DATA.tinggiKaca, p=SUS[R.pelaku];
  const D=num(R.D), Dk=p?Dval(p,H):NaN;
  const cD = p && !isNaN(D) && (near(D,Dk)||near(D,Dk/(p.a*p.a)));
  const cP = /puncak|maksimum|tertinggi|\(\s*4\s*[,;]\s*9\s*\)|9\s*m/.test(t);
  const reason=/negatif|d\s*<\s*0|kurang dari (nol|0)|tidak (mencapai|sampai|bisa)|tak (mencapai|sampai)|tidak memotong|tidak ada akar/.test(t);
  const others=['raka','dinda','robo'].filter(k=>k!==R.pelaku).filter(k=>t.includes(SUS[k].nama.toLowerCase().replace('si ',''))).length;
  const both=/keduanya|kedua tersangka|tersangka lain|dua siswa/.test(t);
  const cT = reason ? ((others>=2||both)?10:(others===1?5:0)) : 0;
  return { cD, cP, cT, skor:(cD?8:0)+(cP?7:0)+cT, benar:R.pelaku==='robo' };
}

   <div class="evcard"><div class="t">Laporan Kasus · ${esc(S.name)}${tim()?' (Tim)':''}</div><p style="margin-top:6px">${esc(lap)}</p></div>
   <div class="row"><button class="sm" id="spk">Bacakan laporan</button></div>
   <div class="box"><h3>Pemeriksaan Inspektur Vera</h3><div id="ck" style="display:flex;flex-direction:column;gap:6px"></div></div>
   <div class="actions"><button class="primary" id="nx" hidden>Lihat Putusan</button></div>`;
  $('#spk').onclick=()=>say(lap);
  const items=[
    [v.benar,`Tersangka yang dituduh: ${nama}`],
    [v.cD,`Nilai D sesuai untuk lintasan ${nama} di ketinggian ${fmt(DATA.tinggiKaca)} m`],
    [v.cP,'Argumen menyebut titik puncak atau tinggi maksimum'],
    [v.cT===10,v.cT===5?'Alasan menolak tersangka lain baru untuk satu orang':'Alasan menolak tersangka lain dengan data (D < 0 atau tidak mencapai kaca)'],
    [okPl>=placed.length-1&&placed.length>0,`Papan Bukti: ${okPl} dari ${placed.length} kartu terhubung ke tersangka yang tepat`]
  ];
  let i=0; const ck=$('#ck');
  const iv=setInterval(()=>{ if(i>=items.length){ clearInterval(iv); $('#nx').hidden=false; return; } const [ok,t]=items[i++]; sfxTick();
    ck.insertAdjacentHTML('beforeend',`<p class="fb ${ok?'ok':'no'} small">${ok?'✓':'✗'} ${t}</p>`); }, reduceMotion?0:600);
  $('#nx').onclick=()=>{ S.accuse++;
    S.laporan=v.benar?v.skor:0;
    const wa=S.wrongAcc||0;
    if(v.benar){ S.tuduhan = wa===0?20:(wa===1?10:5); S.ending = v.skor>=20 ? 'utama' : 'menggantung'; }
    else { S.wrongAcc=wa+1; S.tuduhan=0; S.ending='salah'; }
    save(); updateHud(); go('s13'); };
};

/* S13 Ending */
SCN.s13=st=>{
  const e=S.ending, R=S.report, H=DATA.tinggiKaca;
  if(e==='utama'){
    st.innerHTML=`<span class="tapelabel">Putusan · Kasus Terpecahkan</span><h2>Ending: Detektif Utama</h2>
     <svg class="scene-svg" viewBox="0 0 480 200" role="img" aria-label="Si Robo diperbaiki teknisi"><rect width="480" height="200" fill="#0f1115"/><g transform="translate(170 20) scale(1.6)">${av('robo','senang').replace(/<\/?svg[^>]*>/g,'')}</g><g stroke="var(--tape)" stroke-width="4" stroke-linecap="round"><path d="M120 60 l20 20 M360 60 l-20 20 M110 120 h24 M370 120 h-24"/></g><text x="240" y="190" fill="var(--tape)" text-anchor="middle" font-family="monospace" font-size="13">SUDUT PELONTAR DIKALIBRASI ULANG</text></svg>
     ${talk('vera','Inspektur Vera',`Luar biasa. Lintasan Si Robo satu-satunya yang mencapai kaca ${fmt(H)} m. Raka dan Dinda bebas. Data mengalahkan prasangka.`,'senang')}
     ${talk('robo','Si Robo','BIP. Kalibrasi selesai. Maaf, kaca ruang guru.','senang')}
     <div class="row" style="justify-content:center">${badge('emas')}</div>
     <div class="actions"><button class="primary" id="nx">Refleksi & Sertifikat</button></div>`;
    $('#nx').onclick=()=>{ saveRekap(); go('s14'); };
  } else if(e==='menggantung'){
    const v=nilaiLaporan(); const kurang=[]; if(!v.cD) kurang.push(`nilai D Si Robo pada ketinggian ${fmt(H)} m`); if(!v.cP) kurang.push('titik puncak atau tinggi maksimum lintasan Si Robo'); if(v.cT<10) kurang.push('alasan menolak Raka dan Dinda dengan data D mereka');
    st.innerHTML=`<span class="tapelabel">Putusan · Ditunda</span><h2>Ending: Kasus Menggantung</h2>
     ${talk('vera','Inspektur Vera',`Tersangkamu tepat, tetapi laporan ini belum cukup kuat untuk sidang. Perkuat argumenmu. Yang masih kurang: ${kurang.join('; ')}.`)}
     <p class="fb info">Skor laporan saat ini ${S.laporan}/25. Kembali ke Papan Bukti untuk memperbaikinya.</p>
     <div class="actions"><button id="fin" class="ghost">Selesaikan apa adanya</button><button class="primary" id="nx">Perkuat Laporan</button></div>`;
    $('#nx').onclick=()=>go('s11'); $('#fin').onclick=()=>{ saveRekap(); go('s14'); };
  } else {
    const k=R.pelaku, p=SUS[k], [vx,vy]=vtx(p), D=Dval(p,H);
    st.innerHTML=`<span class="tapelabel" style="background:var(--red);color:#fff">Putusan · Salah Tuduh</span><h2>Ending: Salah Tuduh</h2>
     ${talk(k,p.nama,`Itu tidak mungkin aku. Lintasanku h(x) = ${poly(p.a,p.b,p.c)} paling tinggi cuma ${fmt(vy)} meter di x = ${fmt(vx)}. Kalau h(x) = ${fmt(H)}, D-nya ${fmt(D)}, negatif. Bolaku tidak pernah sampai ke kaca!`,'gugup')}
     ${graph({xr:[0,8],yr:[0,10],h:210,curves:[{f:f(p),color:'var(--red)',from:0}],hlines:[{y:H,color:'var(--blue)',label:`kaca ${fmt(H)} m`}],points:[{x:vx,y:vy,label:fmt(vy)+' m'}]})}
     ${talk('vera','Inspektur Vera','Inilah bahayanya menyimpulkan tanpa data. Kembali ke rekaman CCTV. Kali ini perhatikan baik-baik nilai c.')}
     <p class="fb info">Diskusikan di kelas: bukti mana yang tadi kamu abaikan?</p>
     <div class="actions"><button class="primary" id="nx">Kembali ke Bab 3 dengan petunjuk baru</button></div>`;
    $('#nx').onclick=()=>{ S.hint3=true; save(); go('s09'); };
  }
};
function badge(kind){ const c=kind==='emas'?['#f6d365','#c99a1b']:['#d9dde3','#8a929c'];
  return `<svg class="badge" viewBox="0 0 100 100" role="img" aria-label="Lencana ${kind}"><path d="M30 60 L22 96 L40 86 L50 98 L52 64Z M70 60 L78 96 L60 86 L50 98 L48 64Z" fill="var(--red)"/><circle cx="50" cy="44" r="34" fill="${c[1]}"/><circle cx="50" cy="44" r="28" fill="${c[0]}"/><path d="M32 52 Q50 14 68 52" fill="none" stroke="${c[1]}" stroke-width="4"/><circle cx="50" cy="33" r="4" fill="${c[1]}"/></svg>`; }
function saveRekap(){
  if(S.saved) return; S.saved=true;
  const r={tgl:new Date().toLocaleString('id-ID'),nama:S.name,kelas:S.kelas,absen:S.absen,mode:tim()?`Tim (${S.role}${S.team?': '+S.team:''})`:'Individu',
    b1:chScore(1),b2:chScore(2),b3:chScore(3),b4:chScore(4),cocok:S.match.score,tuduhan:S.tuduhan,laporan:S.laporan,total:total(),
    bantuan:[1,2,3,4].reduce((a,n)=>a+S.ch[n].help,0),ending:{utama:'Detektif Utama',menggantung:'Kasus Menggantung',salah:'Salah Tuduh'}[S.ending]||'',
    teks:`Pelakunya ${SUS[S.report.pelaku]?.nama||'-'} karena ${S.report.alasan} (D = ${S.report.D})`};
  try{ const L=rekapList(); L.push(r); localStorage.setItem(RKEY,JSON.stringify(L)); }catch(e){}
  save();
}

/* S14 Refleksi & Sertifikat */
SCN.s14=st=>{
  const Q=['Konsep fungsi kuadrat mana yang paling menentukan terpecahkannya kasus?','Di mana kamu sempat salah, dan apa yang membuatmu sadar?','Sebutkan satu lintasan parabola lain di sekitarmu dan apa arti titik puncaknya.'];
  const lencana=S.ending==='utama'?'emas':'perak';
  const tgl=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
  const rekap=`REKAP KASUS PARABOLA\nNama: ${S.name} | Kelas: ${S.kelas} | Absen: ${S.absen} | Mode: ${tim()?'Tim - '+S.role:'Individu'}\nBab 1: ${chScore(1)}/10 | Bab 2: ${chScore(2)}/10 | Bab 3: ${chScore(3)}/10 | Bab 4: ${chScore(4)}/10\nCocokkan Jejak: ${S.match.score}/15 | Tuduhan: ${S.tuduhan}/20 | Laporan: ${S.laporan}/25\nTOTAL: ${total()}/100 | Bantuan dibuka: ${[1,2,3,4].reduce((a,n)=>a+S.ch[n].help,0)} | Ending: ${S.ending==='utama'?'Detektif Utama':'Kasus Menggantung'}\nLaporan: Pelakunya ${SUS[S.report.pelaku]?.nama} karena ${S.report.alasan} (D = ${S.report.D})`;
  st.innerHTML=`<span class="tapelabel">Arsip Kasus</span><h2>Refleksi & Sertifikat</h2>
   <div class="grid2"><div class="box"><h3>Rekap Kasus</h3>
     <table class="tbl"><tbody>
      ${[1,2,3,4].map(n=>`<tr><td>Kartu Bukti Bab ${n}</td><td>${chScore(n)}/10</td></tr>`).join('')}
      <tr><td>Cocokkan Jejak</td><td>${S.match.score}/15</td></tr><tr><td>Ketepatan tuduhan</td><td>${S.tuduhan}/20</td></tr><tr><td>Laporan Kasus</td><td>${S.laporan}/25</td></tr>
      <tr><td><b>Total</b></td><td><b>${total()}/100</b></td></tr></tbody></table></div>
   <div class="box"><h3>Pertanyaan Refleksi</h3>${Q.map((q,i)=>`<div class="field"><label for="q${i}">${i+1}. ${q}</label><textarea id="q${i}">${esc(S.refl[i])}</textarea></div>`).join('')}</div></div>
   <div class="cert" id="cert">
     <span class="small type">Satuan Detektif Matematika · SMAN 2 Tangerang</span>
     <h2>Sertifikat Detektif Parabola</h2><span class="small">diberikan kepada</span>
     <div class="nm">${esc(S.name)}</div><span class="type small">Kelas ${esc(S.kelas)} · No. ${esc(S.absen)}${tim()&&S.team?' · Tim: '+esc(S.team):''}</span>
     ${badge(lencana)}
     <p>atas keberhasilan memecahkan <b>Kasus Kaca Pecah Ruang Guru</b> dengan fungsi kuadrat. Skor ${total()}/100 · Lencana ${lencana}.</p>
     <span class="type small">Inspektur Vera · ${tgl}</span></div>
   <p class="muted small">Untuk menyimpan sertifikat, ambil tangkapan layar bagian ini.</p>
   <div class="box"><h3>Laporan untuk Guru</h3><p class="muted small">Salin rekap ini dan kirim ke guru. Rekap juga tersimpan di menu Rekap Guru pada perangkat ini.</p>
     <div class="row"><button class="primary" id="cp">Salin rekap</button><span id="cpm" class="muted small"></span></div></div>
   <div class="actions"><button id="again">Main lagi</button><button class="primary" id="done">Selesai</button></div>`;
  Q.forEach((_,i)=>$('#q'+i).oninput=e=>{ S.refl[i]=e.target.value; save(); });
  $('#cp').onclick=()=>copyText(rekap+'\n\nRefleksi:\n'+S.refl.map((r,i)=>`${i+1}. ${r}`).join('\n'),$('#cpm'));
  $('#again').onclick=()=>{ const m=S.music; S=fresh(); S.music=m; save(); go('s01'); };
  $('#done').onclick=()=>{ const m=S.music; S=fresh(); S.music=m; save(); go('s01'); };
};

/* ---------- boot ---------- */
go('s01');
</script>

</body></html>
